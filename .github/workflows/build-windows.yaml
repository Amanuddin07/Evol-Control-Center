name: Build Windows Desktop App & Installer

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore and publish portable executable
        shell: pwsh
        run: |
          $projDir = "windows/EvolControlCenter"
          $outDir = "dist/portable"
          New-Item -ItemType Directory -Force -Path $outDir | Out-Null
          dotnet restore "$projDir/EvolControlCenter.csproj"
          dotnet publish "$projDir/EvolControlCenter.csproj" -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o $outDir
          $lines = Get-ChildItem -Path $outDir -File | Where-Object { $_.Name -ne "CHECKSUMS.txt" } | ForEach-Object {
            $hash = (Get-FileHash -Path $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)"
          }
          [System.IO.File]::WriteAllLines("$outDir/CHECKSUMS.txt", $lines)

      - name: Build Windows installer with Inno Setup
        shell: pwsh
        run: |
          $projDir = "windows/EvolControlCenter"
          $issPath = "$projDir/installer/EvolControlCenter.iss"
          $setupOut = "dist/setup"
          New-Item -ItemType Directory -Force -Path $setupOut | Out-Null
          if (Test-Path $issPath) {
            iscc "/O$setupOut" "$issPath"
            Get-ChildItem -Path $setupOut -File | ForEach-Object {
              $hash = (Get-FileHash -Path $_.FullName -Algorithm SHA256).Hash.ToLower()
              "$hash  $($_.Name)"
            } | Out-File -FilePath "$setupOut/CHECKSUMS.txt" -Encoding utf8
          } else {
            Write-Warning "Installer script not found at $issPath; skipping installer step."
          }

      - name: Upload Portable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: EVOL-Control-Center-Portable
          path: dist/portable/*

      - name: Upload Setup Artifact
        if: hashFiles('windows/EvolControlCenter/installer/EvolControlCenter.iss') != ''
        uses: actions/upload-artifact@v4
        with:
          name: EVOL-Control-Center-Setup
          path: dist/setup/*
